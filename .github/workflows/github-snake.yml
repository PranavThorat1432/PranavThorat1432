name: Generate Snake Animation

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate custom pink/purple snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: PranavThorat1432
          outputs: |
            dist/github-snake.svg?color_snake=#ff5fc7&color_dots=#3a1c58,#6d3fae,#9b4bff,#ff5fc7,#ff9be0
            dist/github-snake-dark.svg?color_snake=#ff5fc7&color_dots=#170a29,#3a1c58,#6d3fae,#9b4bff,#ff5fc7&color_snake=#ff9be0
            dist/github-snake-light.svg?color_snake=#c2178f&color_dots=#f8ecff,#e8d3ff,#c893ff,#9b4bff,#7c3aed

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
