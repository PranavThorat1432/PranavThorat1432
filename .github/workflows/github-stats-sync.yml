name: Sync Live GitHub Stats

# Regenerates stats.svg, langs.svg, trophies.svg from real GitHub data, and
# patches the 4 stat numbers inside banner.svg / banner-light.svg in place.
# Everything else in those files (name, layout, animations) is left untouched.

on:
  schedule:
    # Runs daily at 03:00 UTC - separate from the snake workflow's midnight
    # run so the two don't race on the same commit.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live stats from GitHub API
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_STATS_USERNAME: PranavThorat1432
        run: python scripts/fetch_stats.py

      - name: Regenerate stats.svg / langs.svg / trophies.svg and patch banners
        run: python scripts/render_svgs.py

      - name: Commit changes if anything actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg trophies.svg banner.svg banner-light.svg stats_data.json
          if git diff --cached --quiet; then
            echo "No changes in live stats - nothing to commit."
          else
            git commit -m "chore: sync live GitHub stats [skip ci]"
            git push
          fi

# --------------------------------------------------------------------------
# ONE-TIME SETUP REQUIRED (this is a real requirement, not optional):
#
# The built-in GITHUB_TOKEN authenticates as github-actions[bot] and cannot
# read YOUR contribution history via GraphQL - so this workflow needs a
# Personal Access Token with the `read:user` scope:
#
#   1. GitHub -> Settings -> Developer settings -> Personal access tokens
#      -> Fine-grained tokens (or classic) -> Generate new token
#   2. Scope: read:user (classic) is sufficient; no repo write access needed
#      for the token itself, since the workflow's own GITHUB_TOKEN handles
#      the commit/push step.
#   3. In this repo: Settings -> Secrets and variables -> Actions
#      -> New repository secret -> name it GH_STATS_TOKEN, paste the token.
#
# Without step 3, fetch_stats.py will fail immediately with a clear error
# rather than silently producing wrong numbers.
# --------------------------------------------------------------------------
